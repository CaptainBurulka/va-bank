<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Індекс карт — перевірка контрасту</title>
<link rel="stylesheet" href="../../ui/tokens.css"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../ui/skins/skins.css">
<style>
  body { background: #0d1410; color: #cfd6d0; font: 12px/1.3 Manrope, sans-serif; margin: 0; padding: 12px 16px 40px; overflow: auto; height: auto; }
  h2 { font-size: 13px; margin: 14px 0 6px; } .row { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: flex-end; margin-bottom: 4px; }
  .lab { width: 64px; font-size: 11px; opacity: .7; } .hand-size .card { --cw: var(--card-w-hand); } .table-size .card { --cw: var(--card-w-table); }
  .felt { background: radial-gradient(#1f6b47, #0c3a26); padding: 14px 8px 8px; border-radius: 12px; }
</style></head>
<body>
<div id="root"></div>
<script type="module">
  import { cardEl } from '../../ui/cardview.js';
  import { SETS } from '../../ui/skins/render.js';
  const params = new URLSearchParams(location.search);
  const only = params.get('set');
  const R = ['common', 'rare', 'epic', 'legendary'];
  const cards = [{ kind: 'num', value: 7, suit: 'water' }, { kind: 'num', value: 10, suit: 'fire' }, { kind: 'num', value: 3, suit: 'stone' }, { kind: 'knife' }];
  const root = document.getElementById('root');
  for (const set of Object.values(SETS)) {
    if (only && set.id !== only) continue;
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${set.name}</h2>`;
    for (const r of R) for (const size of ['hand', 'table']) {
      const row = document.createElement('div');
      row.className = `row felt ${size}-size`;
      row.dataset.skinDeck = `${set.id}:${r}:42`;
      row.innerHTML = `<span class="lab">${r}<br>${size === 'hand' ? 'рука' : 'стіл'}</span>`;
      sec.append(row);
      cards.forEach((c, i) => {
        // карта камінь — козир (бейдж і контур однакові в руці і на столі)
        const el = cardEl({ id: `${set.id}${r}${size}${i}`, ...c }, { trump: 'stone', bonus: 1, skinDeck: `${set.id}:${r}:42` });
        el.dataset.key = `${set.id}|${r}|${size}|${c.kind === 'num' ? c.suit : c.kind}`;
        row.append(el);
      });
    }
    root.append(sec);
  }
  // аналіз пікселів (викликає tests/e2e/contrast.cjs): screenshot зони індексу → канва → контраст
  const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  window.analyze = async (dataUrl, regions) => {
    const img = new Image(); img.src = dataUrl; await img.decode();
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, c.width, c.height).data;
    const at = (x, y) => { const i = (y * c.width + x) * 4; return [px[i], px[i + 1], px[i + 2]]; };
    // фон плашки — найчастіший колір усієї зони
    const hist = new Map();
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) { const p = at(x, y); const k = p.map((v) => v >> 3).join(','); hist.set(k, (hist.get(k) || 0) + 1); }
    const top = [...hist.entries()].sort((a, b) => b[1] - a[1])[0][0].split(',').map((v) => (+v << 3) + 4);
    const out = {};
    for (const [name, rc] of Object.entries(regions)) {
      const pts = [];
      for (let y = Math.max(0, rc.y); y < Math.min(c.height, rc.y + rc.h); y++) for (let x = Math.max(0, rc.x); x < Math.min(c.width, rc.x + rc.w); x++) pts.push(at(x, y));
      pts.sort((a, b) => contrast(b, top) - contrast(a, top));
      const core = pts.slice(0, Math.max(4, Math.round(pts.length * .08)));
      const fg = [0, 1, 2].map((k) => Math.round(core.reduce((s, p) => s + p[k], 0) / core.length));
      out[name] = { contrast: +contrast(fg, top).toFixed(2), fg, bg: top };
    }
    return out;
  };
  window.ready = true;
</script>
</body></html>
